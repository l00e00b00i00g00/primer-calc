name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly Primer3 cross-validation (Monday 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # full signal on every runner, never hide green jobs
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        # Pinned channel mirrors wasm/rust-toolchain.toml (reproducible builds).
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Audit production dependencies (gate)
        # Zero runtime dependencies: this must always be clean.
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full tree (informational)
        # Dev-toolchain advisories (vitest/vite) are tracked, not gating.
        run: npm audit || true
      - name: Build TypeScript
        run: npm run build
      - name: Snapshot committed wasm-pkg
        run: cp -r wasm-pkg /tmp/wasm-pkg.committed
      - name: Build WASM core
        run: npm run build:wasm
      - name: Verify committed wasm-pkg matches sources (functional)
        # Byte-exact .wasm comparison is toolchain-fragile (prebuilt vs
        # source-built wasm-bindgen emit different bytes); instead, require
        # bit-identical engine outputs on a fixed battery, then restore the
        # committed artifacts untouched.
        run: |
          node scripts/check-wasm-equivalence.mjs /tmp/wasm-pkg.committed ./wasm-pkg
          rm -rf wasm-pkg && cp -r /tmp/wasm-pkg.committed wasm-pkg
          git diff --exit-code -- wasm-pkg/
      - name: Tests with coverage (100% gate)
        run: npm run test:coverage
      - name: Package validation (publint)
        run: npx -y publint
      - name: Types validation (attw)
        run: >
          npm pack --pack-destination /tmp --silent &&
          npx -y -p @arethetypeswrong/cli attw
          --pack /tmp/sfstudio_tools-primer-calc-*.tgz

  primer3:
    # Continuous cross-validation against Primer3 thermodynamics.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install primer3-py
        run: pip install 'primer3-py>=2.3'
      - name: Check goldens for drift
        run: python3 scripts/primer3-regen.py --check
