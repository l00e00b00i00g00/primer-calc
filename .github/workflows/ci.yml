name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly Primer3 cross-validation (Monday 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build TypeScript
        run: npm run build
      - name: Build WASM core
        run: npm run build:wasm
      - name: Verify committed wasm-pkg matches sources
        run: git diff --exit-code -- wasm-pkg/
      - name: Tests with coverage (100% gate)
        run: npm run test:coverage

  primer3:
    # Continuous cross-validation against Primer3 thermodynamics.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install primer3-py
        run: pip install 'primer3-py>=2.3'
      - name: Check goldens for drift
        run: python3 scripts/primer3-regen.py --check
